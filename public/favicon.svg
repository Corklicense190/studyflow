  </defs>
  <rect width="32" height="32" rx="8" fill="url(#fondo)"/>
  <g transform="translate(4 4)" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 6.8C15.9 5.6 14.2 5 12.4 5 9.9 5 8 6.3 8 8.3c0 2 1.7 2.8 4.4 3.5 2.9.8 4.6 1.7 4.6 3.9 0 2-1.9 3.4-4.6 3.4-1.9 0-3.6-.7-4.7-1.9"/>
    <circle cx="19.4" cy="5.6" r="1.9" stroke-width="1.6"/>
    <circle cx="5.4" cy="18.4" r="1.9" stroke-width="1.6"/>
